input {
  http {
    port => 5000
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
    }
    add_field => {
      "[@metadata][type]" => "agent_metrics"
    }
  }
  
  kafka {
    bootstrap_servers => "${KAFKA_BROKERS:-kafka:29092}"
    topics => ["siem-logs", "agent-metrics", "security-events"]
    codec => json
    consumer_threads => 2
    auto_offset_reset => "latest"
    decorate_events => true
  }
}

filter {
  # Определяем тип события
  if [host_id] or [host][id] {
    mutate {
      add_tag => ["agent_data"]
    }
  }
  
  if [metrics] {
    mutate {
      add_tag => ["metrics", "telemetry"]
    }
    
    # Разбираем метрики для вашего ingestHandler.ProcessAgentData
    ruby {
      code => '
        if event.get("[metrics]").is_a?(Hash)
          event.set("[data]", event.get("[metrics]"))
          event.remove("[metrics]")
        end
      '
    }
  }
  
  if [traffic] or [network] {
    mutate {
      add_tag => ["network", "traffic"]
    }
    # Для ingestHandler.ProcessNetworkLog
  }
  
  # Добавляем timestamp
  date {
    match => ["timestamp", "ISO8601", "UNIX_MS", "UNIX"]
    target => "@timestamp"
  }
  
  # Обогащаем данные
  if [host][id] {
    mutate {
      add_field => {
        "host_id" => "%{[host][id]}"
      }
    }
  }
  
  # GeoIP для IP адресов
  if [remote_addr] or [source_ip] {
    geoip {
      source => "[remote_addr]"
      target => "geoip"
    }
  }
}

output {
  # OpenSearch - основной индекс для вашего бэкенда
  opensearch {
    hosts => ["${OPENSEARCH_URL:-http://opensearch:9200}"]
    user => "${OPENSEARCH_USER:-admin}"
    password => "${OPENSEARCH_PASSWORD:-StrongPass123!}"
    index => "railgun-logs-%{+YYYY.MM.dd}"
    ssl_verification_mode => "none"
    ecs_compatibility => disabled
  }
  
  # Отдельные индексы по типам
  if "security" in [tags] {
    opensearch {
      hosts => ["${OPENSEARCH_URL:-http://opensearch:9200}"]
      user => "${OPENSEARCH_USER:-admin}"
      password => "${OPENSEARCH_PASSWORD:-StrongPass123!}"
      index => "railgun-security-%{+YYYY.MM.dd}"
      ssl_verification_mode => "none"
    }
  }
  
  if "metrics" in [tags] {
    opensearch {
      hosts => ["${OPENSEARCH_URL:-http://opensearch:9200}"]
      user => "${OPENSEARCH_USER:-admin}"
      password => "${OPENSEARCH_PASSWORD:-StrongPass123!}"
      index => "railgun-metrics-%{+YYYY.MM.dd}"
      ssl_verification_mode => "none"
    }
  }
  
}