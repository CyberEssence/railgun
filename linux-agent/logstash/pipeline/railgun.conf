input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["siem-logs"]
    codec => json
    group_id => "logstash-siem"
    consumer_threads => 3
    auto_offset_reset => "latest"
    decorate_events => true
  }
}

filter {
  # Парсинг системных логов
  if [type] == "system_info" {
    mutate {
      add_tag => ["system", "metrics"]
    }
    
    # Конвертация времени
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
  
  if [type] == "network_info" {
    mutate {
      add_tag => ["network", "security"]
    }
  }
  
  if [type] == "security_info" {
    mutate {
      add_tag => ["security", "audit"]
    }
    
    # Геолокация по IP
    geoip {
      source => "[connections][remote_addr]"
      target => "geoip"
    }
  }
  
  # Добавление host информации
  mutate {
    add_field => {
      "agent" => "linux-agent"
      "collector_version" => "1.0"
    }
  }
}

output {
  # В OpenSearch
  opensearch {
    hosts => ["http://opensearch-node1:9200", "http://opensearch-node2:9200"]
    index => "siem-logs-%{+YYYY.MM.dd}"
    user => "admin"
    # paste your pass
    password => ""
    template => "/usr/share/logstash/templates/siem-template.json"
    template_name => "siem"
    template_overwrite => true
  }
  
  # В ваше SIEM приложение (дополнительно)
  http {
    url => "http://your-siem-backend:8080/api/traffic/logs"
    http_method => "post"
    format => "json"
    headers => {
      "Authorization" => "Bearer your-token"
      "Content-Type" => "application/json"
    }
  }
  
  # Для отладки
  stdout {
    codec => rubydebug
  }
}