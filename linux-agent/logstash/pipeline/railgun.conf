input {
  # HTTP input для прямого приема от агентов
  http {
    port => 5000
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
    }
  }
  
  # Kafka input
  kafka {
    bootstrap_servers => "${KAFKA_BROKERS:-kafka:29092}"
    topics => ["siem-logs"]
    codec => json
    consumer_threads => 2
    auto_offset_reset => "latest"
  }
}

filter {
  # Добавляем метаданные
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "siem-logs"
    }
  }
  
  # Парсинг в зависимости от типа метрик
  if [metrics] {
    # Для батча метрик
    ruby {
      code => '
        event.get("metrics").each do |metric|
          # Создаем отдельные события для каждого типа метрик
          cloned = event.clone
          cloned.set("[@metadata][index_prefix]", "siem-#{metric["type"]}")
          cloned.set("[data]", metric)
          cloned.tag("processed")
          event.cancel if event == event
        end
      '
    }
  }
  
  # Геолокация для IP адресов
  if [data][network][connections] {
    geoip {
      source => "[data][network][connections][remote_addr]"
      target => "geoip"
    }
  }
  
  # Преобразование timestamp
  date {
    match => ["[data][timestamp]", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  # OpenSearch
  opensearch {
    hosts => ["${OPENSEARCH_URL:-https://opensearch:9200}"]
    user => "${OPENSEARCH_USER:-admin}"
    password => "${OPENSEARCH_PASSWORD:-MyStrongPassword123!}"
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    ssl_verification_mode => "none"
    ecs_compatibility => disabled
  }
  
  # Отладка (опционально)
  stdout {
    codec => rubydebug { metadata => true }
  }
}