services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: railgun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - railgun-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: railgun-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=railgun-es
      - cluster.name=railgun-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ingest.geoip.downloader.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${OPENSEARCH_PORT}:9200"
    networks:
      - railgun-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: railgun-kibana
    restart: unless-stopped
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT}:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - railgun-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: railgun-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - railgun-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend
  railgun-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railgun-backend-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Основные настройки
      - PORT=${PORT}
      - GIN_MODE=${GIN_MODE}
      - LOG_LEVEL=${LOG_LEVEL}
      
      # PostgreSQL
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      
      # Elasticsearch
      - ELASTICSEARCH_URL=http://elasticsearch:${OPENSEARCH_PORT}
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
      - ELASTICSEARCH_INSECURE=true
      
      # OpenSearch (для обратной совместимости)
      - OPENSEARCH_URL=http://elasticsearch:${OPENSEARCH_PORT}
      - OPENSEARCH_USERNAME=
      - OPENSEARCH_PASSWORD=
      - OPENSEARCH_INSECURE=true
      
      # Elastic URL (для ingestHandler)
      - ELASTIC_URL=http://elasticsearch:${OPENSEARCH_PORT}
      
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
      
      # JWT и шифрование
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      
      # Detection settings
      - DETECTION_BF_THRESHOLD=${DETECTION_BF_THRESHOLD}
      - DETECTION_BF_WINDOW_SEC=${DETECTION_BF_WINDOW_SEC}
      
      # Kafka (опционально)
      - KAFKA_ENABLED=${KAFKA_ENABLED}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      
      # SIEM токен для агентов
      - SIEM_TOKEN=${SIEM_TOKEN}
      
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - ./backend/configs:/app/configs:ro
      - ./backend/migrations:/app/migrations:ro
    ports:
      - "${PORT}:8080"
      - "2112:2112"
      - "2345:2345"
    networks:
      - railgun-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    build:
      context: ./frontend-core
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_WS_URL=${REACT_APP_WS_URL}
    container_name: railgun-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL}
      - NODE_ENV=${NODE_ENV}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - railgun-network
    depends_on:
      railgun-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  elasticsearch-data:
    driver: local
  redis-data:
    driver: local

networks:
  railgun-network:
    driver: bridge
    name: railgun-network